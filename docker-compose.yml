# Local development services. Start with `npm run db:up`.
name: pokefindr
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pokefindr
      POSTGRES_PASSWORD: pokefindr
      POSTGRES_DB: pokefindr
    ports:
      - "5433:5432"
    volumes:
      - pokefindr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokefindr -d pokefindr"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Full app from the production image: `docker compose --profile app up --build`
  app:
    profiles: ["app"]
    build: .
    ports:
      - "3000:3000"
    environment:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://pokefindr:pokefindr@db:5432/pokefindr
      JWT_SECRET: local-dev-secret-change-me
      # Auth still runs on Supabase until the auth migration; set these in
      # .env.local to use login and sign-up locally.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-unset}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-unset}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pokefindr-db:

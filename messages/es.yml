      claude:
        settings: En Claude (web o escritorio), abre Settings y luego Connectors.
        add: Agrega un conector personalizado llamado PokeFindr, con la URL de abajo.
        account: Con la URL de la cuenta, Claude abre PokeFindr para que inicies sesión y lo apruebes.
      claudeCode: Ejecuta esto en una terminal. Usa la URL de la cuenta para iniciar sesión (ejecuta /mcp en Claude Code para terminar).
      chatgpt:
        settings: En ChatGPT, abre Settings, luego Apps & Connectors, y activa el modo de desarrollador en Advanced.
        add: Crea un conector llamado PokeFindr con la URL de abajo.
        account: "Con la URL de la cuenta, elige OAuth: ChatGPT abre PokeFindr para que inicies sesión y lo apruebes."

  changelog:
    # The page's title and description for search engines.
    meta:
      title: "Novedades de PokeFindr"
      description: "Cada versión de PokeFindr y lo que cambió: mejoras del mapa, cuentas, reseñas y más."
    title: Novedades de la versión {version}
    v1_1:
      released: Publicada el 10 de mayo de 2025
      intro: Hicimos mejoras para que encontrar máquinas expendedoras cerca de ti sea más fácil y rápido.
      items:
        load: <b>Mapa más rápido</b> – El mapa ahora se abre más rápido y funciona con fluidez.
        grouping: <b>Agrupación inteligente</b> – Las máquinas cercanas se agrupan para que el mapa se vea despejado.
        precise: <b>Ubicaciones precisas</b> – Cada marcador de máquina está más cerca de su lugar real.
        data: <b>Datos al día</b> – Las máquinas agregadas recientemente ya están en el mapa.
        zoom: <b>Zoom fácil</b> – Toca cualquier grupo para acercarte y ver cada máquina por separado.
        search: <b>Barra de búsqueda</b> – Busca cualquier dirección y encuentra la máquina expendedora más cercana en un radio de 30 millas.
        ui: <b>Cambios en la interfaz</b> – La barra lateral ahora estorba menos.
        discord: <b>Comunidad de Discord</b> – Ahora tenemos una comunidad en Discord para pedir ayuda o sugerir funciones nuevas. Haz clic en Soporte en la página de inicio.
    v1_2:
      released: Publicada el 19 de mayo de 2025
      intro: Esta actualización trae varias funciones nuevas y mejoras.
      items:
        accounts: <b>Cuentas gratis</b> – Ahora puedes crear una cuenta gratis <i>(requiere verificar tu correo)</i>.
        reviews: <b>Gestión de reseñas</b> – Agrega, edita y elimina reseñas de lugares.
        settings: <b>Página de configuración</b> – Administra tu perfil, tus preferencias y la información de tu cuenta.
        sso: <b>Inicio de sesión único (SSO)</b> – Inicia sesión con Google u otros proveedores.
        ratings: <b>Calificaciones con estrellas</b> – Los lugares ahora tienen calificaciones con estrellas según las reseñas de los usuarios.
    modal:
      items:
        accounts: <b>Cuentas gratis</b> – Ahora puedes crear una cuenta gratis.
        settings: <b>Página de configuración</b> – Administra tu perfil y la información de tu cuenta.
        sso: <b>Inicio de sesión único (SSO)</b> – Inicia sesión con Google (pronto más proveedores).
      close: ¡Entendido!
  developers:
    meta:
      title: "PokeFindr para desarrolladores: úsalo desde Claude, ChatGPT y Cursor"
      description: Conecta el servidor MCP de PokeFindr a Claude, ChatGPT, Cursor, VS Code o cualquier cliente MCP para encontrar máquinas expendedoras de cartas Pokémon, tiendas de cartas y eventos.
    title: Usa PokeFindr desde tu asistente de IA
    intro: PokeFindr tiene un servidor MCP, así que Claude, ChatGPT, Cursor y otros clientes MCP pueden encontrar por ti máquinas expendedoras de cartas Pokémon, tiendas de cartas y eventos. Cada respuesta enlaza al mapa.

      withAccount: Con tu cuenta
      find_places: Máquinas expendedoras, tiendas de cartas y eventos cerca de una ciudad o dirección de EE. UU., o en un estado. Hasta 10, primero los más cercanos.
      area_stats: Cuántos lugares de cada tipo hay en una zona, las tiendas principales y las ciudades principales.

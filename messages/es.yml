faq:
  title: Preguntas frecuentes
  intro: ¿Algo más? Pregunta en <link>Soporte</link>.
  items:
    what:
      question: ¿Qué es una máquina expendedora de Pokémon?
      answer: Una máquina expendedora que vende productos oficiales del Juego de Cartas Coleccionables Pokémon, como sobres y Cajas de Entrenador Élite. Las surte The Pokémon Company International, así que todo lo que contienen es auténtico.
    map:
      question: ¿Cómo uso el mapa?
      answer: Busca una ciudad o dirección desde la página de inicio o el mapa. El mapa se abre en esa zona y muestra los lugares dentro de tu radio, primero el más cercano (hasta 200 a la vez). Aleja el mapa para ver todo el país, o elige un estado para explorarlo.
    verified:
      question: ¿Las ubicaciones de las máquinas expendedoras están verificadas?
      answer: Sí. Las ubicaciones vienen de la lista oficial de tiendas en el <center>sitio web del Pokémon Center</center>.
    info:
      question: ¿Qué información hay de cada lugar?
      answer: Cada máquina expendedora muestra su tienda, dirección, número de máquina y un enlace a Google Maps. Los usuarios con sesión iniciada pueden leer y escribir reseñas.
    filter:
      question: ¿Puedo filtrar los lugares?
      answer: Sí. Elige qué tipos de lugares mostrar y fija un radio de búsqueda de 5, 10, 25 o 50 millas.
    add:
      question: ¿Cómo puedo agregar un lugar nuevo?
      answer: Las máquinas expendedoras vienen de la lista oficial, así que avísanos de una que falte a través de <support>Soporte</support>. Pronto podrás agregar tú mismo tiendas de cartas y eventos.
    report:
      question: ¿Puedo reportar información desactualizada o incorrecta?
      answer: Sí. Envíanosla a través de <support>Soporte</support> y la corregiremos.
    account:
      question: ¿Necesito una cuenta?
      answer: No. Cualquiera puede explorar el mapa. Con una cuenta puedes escribir reseñas.
    countries:
      question: ¿PokeFindr está disponible fuera de EE. UU.?
      answer: Todavía no. Los demás países aparecen en gris en el mapa hasta que los agreguemos.
    official:
      question: ¿Es un sitio web oficial de Pokémon?
      answer: No. PokeFindr es un recurso hecho por fans y no está afiliado a The Pokémon Company International.


    title: From the blog
    intro: Learn some cool details about acquiring Pokemon cards for your collection.
  # The release notes: the /changelog page and the pop-up on the signed-in pages.
  # <b> is a feature's name, in bold, before its description.
  changelog:
    # The page's title and description for search engines.
    meta:
      title: "PokeFindr changelog: what's new"
      description: "Every PokeFindr release and what it changed: map updates, accounts, reviews and more."
    # The heading of each release.
    title: What's New in Version {version}
    v1_1:
      released: Released May 10, 2025
      intro: We’ve made improvements to make it easier and faster to find vending machines near you.
      items:
        load: <b>Faster Map Load</b> – The map now opens more quickly and runs smoothly.
        grouping: <b>Smart Grouping</b> – Nearby machines are grouped together so the map stays clear.
        precise: <b>Precise Locations</b> – Each machine pin is more accurate to its real-world spot.
        data: <b>Up-to-Date Data</b> – Machines that were added recently have been added to the map.
        zoom: <b>Easy Zoom</b> – Tap any group to zoom in and view each machine individually.
        search: <b>Search Bar</b> – Search for any address and find the closest vending machine within a 30-mile radius.
        ui: <b>UI Updates</b> – Made the sidebar less intrusive.
        discord: <b>Discord Community</b> – We now have a discord community for users to ask for support or request new features. Click support on the home page.
    v1_2:
      released: Released May 19, 2025
      intro: This update introduces several new features and improvements.
      items:
        # <i> is a note in italics.
        accounts: <b>Free User Accounts</b> – Users can now create accounts for free <i>(Email verification required)</i>.
        reviews: <b>Review Management</b> – Add, edit, and delete reviews for locations.
        settings: <b>Settings Page</b> – Manage your profile, preferences, and account information.
        sso: <b>SSO (Single Sign-On)</b> – Log in using Google or other providers.
        ratings: <b>Star Ratings</b> – Locations now have star ratings based on user reviews.
    # The pop-up shown once on the signed-in pages after a release. Shorter than the page.
    modal:
      items:
        accounts: <b>Free User Accounts</b> – Users can now create accounts for free.
        settings: <b>Settings Page</b> – Manage your profile and account information.
        sso: <b>SSO (Single Sign-On)</b> – Log in using Google (more providers coming).
      close: Got it!
  developers:
    meta:
      title: "PokeFindr for developers: use it from Claude, ChatGPT and Cursor"
      description: Connect PokeFindr's MCP server to Claude, ChatGPT, Cursor, VS Code or any MCP client to find Pokémon card vending machines, card shops and events.
    title: Use PokeFindr from your AI assistant
    intro: PokeFindr runs an MCP server, so Claude, ChatGPT, Cursor and other MCP clients can find Pokémon card vending machines, card shops and events for you. Every answer links back to the map.
    # The two MCP server URLs: one anyone can use, one that signs in to the user's account.
    public:
      title: Public
      badge: No sign-in
      body: Search, counts, routes and events. Nothing to set up.
    account:
      title: Your account
      badge: Log in
      body: Everything above, plus your reviews and submissions, and adding a shop or event. You approve each app once.
    setup:
      title: Set it up
      intro: Pick your client. The snippets use the public URL; swap in the account URL to sign in.
      # A tab for the clients that aren't listed by name (Claude, ChatGPT, Cursor, VS Code).
      other: Other clients
      # Steps for each client. Names of their menus and commands are in quotes in
      # those apps' own words: keep them as the app shows them.
      claude:
        settings: In Claude (web or desktop), open Settings, then Connectors.
        add: Add a custom connector named PokeFindr, with the URL below.
        account: For the account URL, Claude opens PokeFindr to log in and approve it.
      claudeCode: Run this in a terminal. Use the account URL instead to sign in (run /mcp in Claude Code to finish).
      chatgpt:
        settings: In ChatGPT, open Settings, then Apps & Connectors, and turn on developer mode under Advanced.
        add: Create a connector named PokeFindr with the URL below.
        account: "For the account URL, choose OAuth: ChatGPT opens PokeFindr to log in and approve it."
      cursor: Add this to ~/.cursor/mcp.json (or .cursor/mcp.json in a project).
      vscode: "Add this to .vscode/mcp.json, or run MCP: Add Server from the command palette."
      otherClients: Any client that speaks Streamable HTTP works, on the 2025 or 2026-07-28 protocol. Sessions aren't used, so each request stands alone.
    tools:
      title: What it can do
      intro: Ask in plain words, like “Where can I buy Pokémon cards near Denver?” or “Plan a route through the three closest machines to Seattle.”
      everyone: Everyone
      withAccount: With your account
      # What each MCP tool does. The tool names (find_places…) show next to them and aren't translated.
      find_places: Vending machines, card shops and events near a US city or address, or in a state. Up to 10, closest first.
      area_stats: How many of each kind an area has, the top retailers and the top cities.
      plan_route: Puts 2 to 9 places in a sensible order, with a Google Maps directions link.
      list_events: Upcoming card shows, league nights and restocks, soonest or nearest first.
      get_place: One place's details and a summary of its reviews.
      my_reviews: Your reviews, newest first.
      my_submissions: The shops and events you've submitted, and whether each is pending, approved or not approved.
      submit_place: Adds a card shop or event for a moderator to check, as you.
    limits:
      title: Limits and privacy
      rate: Each client can send 30 requests a minute and see 200 different places a day. The map has every place, with no limit.
      answers: Each answer has up to 10 places. Names, addresses and reviews are written by PokeFindr users.
      password: Connecting your account never shares your password. You see what an app asks for before you allow it, and you can disconnect it from the app.
      submissions: Places you submit wait for a moderator, like ones added on the map. You can submit five a day.
      # <link> opens our Discord server.
      questions: Questions or ideas? Ask on <link>Discord</link>.
    # The box around a URL, command or config snippet, with a Copy button. Each
    # kind of snippet has its own messages.
    copy:

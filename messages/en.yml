  # Step 2.
  location:
    hint: Or click the map to drop the pin there. Drag the pin to put it on the entrance.
    # {lat} and {lng} are coordinates.
    pin: "Pin at {lat}, {lng}"
    search: Search an address
    # An example address in the search box.
    searchPlaceholder: 1450 Grant St, Denver
    searchFailed: Search isn't working right now. Click the map instead.
    results: Addresses
    noMatch: No match. Try a street and city, or click the map.
  # Step 3. Each field's label, and a hint under some.
  fields:
    optional: " (optional)"
    name: Name
    # Example names in the name box.
    namePlaceholderShop: Mile High Cards
    namePlaceholderEvent: League night
    venue: Venue
    venueHint: Where it's held, if it has a name.
    # {zone} is like "Mountain Time".
    localTime: "In the event's local time: {zone}"
    # After localTime, until the state is filled in.
    localTimeYours: ", yours. Fill in the state below to use the event's."
    starts: Starts
    ends: Ends
    address: Street address
    addressHintShop: Moderators check shops have one.
    city: City
    state: State
    website: Website
    hours: Hours
    hoursHint: "For example: Mon–Sat 11 AM–8 PM"
    sells: Sells
    link: Link
    linkHint: The organizer's page or sign-up.
    entry: Entry
    free: Free
    paid: Paid
  # What a card shop sells.
  sells:
    singles: Singles
    sealed: Sealed product
    supplies: Supplies
    events: Plays events
  # Step 4.
  review:
    name: Name
    venue: Venue
    when: When
    address: Address
    website: Website
    hours: Hours
    sells: Sells
    link: Link
    entry: Entry
    notGiven: Not given
    confirm: I checked these. This is a different place.
    moderated: A moderator checks it before it goes on the map. Until then only you can see it, marked Pending review.
  # Places close to the pin.
  duplicates:
    title: This might already be on the map
    # A nearby place without a name.
    unnamed: "{kind, select, shop {A card shop} other {An event}}"
    yours: " (yours, waiting for review)"
    # {meters} is a whole number.
    away: "{meters} m away"
  continue: Continue
  placePin: Place the pin to continue
  send: Send for review
  sending: Sending…
  # Next to a field.
  errors:
    check: Check this field.
    startsAt: Pick when it starts.
    hidden: Remove the hidden or control characters.
    linkTooLong: Use a shorter link.
    link: Enter a link starting with https://
    tooLong: "Use at most {max} characters."
    name: Enter a name.
    city: Enter a city.
    endBeforeStart: It has to end after it starts.
    tooManyDays: "An event can last at most {days} days."
    datePassed: That date has passed.
    dateTooFar: Pick a date within the next year.
    alreadyEnded: That event has already ended.
  # Under the form.
  form:
    duplicates: Places like this are close by. Check them, then tick the box to send it anyway.
    sessionEnded: Your session ended. Log in again to send this.
    failed: Couldn't send it. Try again.
    offline: Couldn't reach PokeFindr. Check your connection and try again.

# Words used by many components.
common:
  # Screen-reader label of the X button on dialogs, sheets and drawers.
  close: Close

# The app's navigation: the side rail (desktop), the tab bar (phones) and the user menu.
nav:
  home: Home
  blog: Blog
  map: Map
  discord: Discord
  settings: Settings
  admin: Admin
  # Moderators' dashboard (/moderate).
  moderate: Moderate
  # Tab bar: opens the map's add-a-place flow.
  addPlace: Add a place
  # Accessible names of the navigation landmarks.
  appNavigation: App navigation
  tabs: Tabs
  # The logo at the top of the rail, a link to the landing page.
  logoHome: PokeFindr home
  # Phones: the button that closes the slide-in rail.
  closeNavigation: Close navigation
  userMenu:
    # The avatar button. {name} is the user's display name.
    trigger: "Account menu for {name}"
    settings: Settings
    logOut: Log out
    logOutFailed: Couldn't log out. Please try again.

# Shared UI pieces (src/components/ui and src/components/pokefindr).
ui:
  # The light/dark theme switch.
  theme:
    # Accessible name of the light/dark/system button group.
    group: Theme
    light: Light
    dark: Dark
    system: System
    # The one-button version: what clicking it does.
    switchToLight: Switch to light theme
    switchToDark: Switch to dark theme
  # The language switcher. Each language is listed in its own name ("English", "Español").
  language:
    label: Language
    # When the choice couldn't be saved to their account.
    saveFailed: Couldn't save your language
    saveFailedBody: It's set on this device. Try again from settings to keep it on others.
  starRating:
    # Default accessible name of the star input.
    label: Rating
    # A read-only rating, read by screen readers. {rating} is 0–5 in half steps (4.5).
    readOnly: "{rating, number} out of 5 stars"
    # Each star of the input.
    star: "{count, plural, one {# star} other {# stars}}"
  # Small outlined badges.
  status:
    live: Live
    sample: Sample
    pending: Pending review
    comingSoon: Coming soon
    sponsored: Sponsored
  # The search box on the landing page and the map.
  search:
    # The input's default accessible name.
    label: Search a location
    # The landing page's button.
    submit: Search
    clear: Clear search
    # Result group headings: places from the geocoder, and our own places.
    areas: Areas
    locations: Locations
    error: Search isn't working right now. Try again in a moment.
    searching: Searching…
    # {query} is what was typed.
    noMatches: "No places match “{query}”. Try a city, ZIP code or street address."
    # Keyboard hint under the results. <key></key> draws a key cap.
    keys: "<key>↑</key><key>↓</key> to move <key>↵</key> to open"
    # Read by screen readers when the results change.
    announce:
      error: Search isn't working right now.
      none: No matches.
      results: "{count, plural, one {# result} other {# results}}. Use the arrow keys to move and Enter to open."
  # Default title of a command palette dialog (visually hidden).
  commandDialog: Search

# Sponsored slots.
ads:
  # The small label above a sponsor's card. {sponsor} is its name.

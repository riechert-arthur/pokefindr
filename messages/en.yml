# The assistant on /home: the chat, the composer and the cards in its answers.
# The answers themselves come from the model.
assistant:
  newChat: New chat
  # The composer's placeholder once a conversation has started.
  followUp: Ask a follow-up…
  # Under the composer.
  disclaimer: Distances are straight-line. Answers can be wrong, so check the map.
  composer:
    # Accessible name of the text field.
    label: Message the assistant
    stop: Stop
    send: Send
  # The empty composer types out these example questions one after another.
  placeholder:
    # Shown instead, without moving, when the viewer prefers reduced motion.
    still: Ask about machines, shops or events…
    prompts:
      portland: Vending machines within 5 miles of Portland
      denver: Plan a route through 4 machines near Denver
      washington: Which retailers have the most machines in Washington?
      closest: What's the closest machine to me?
      seattle: Card shops near Seattle that sell singles
      phoenix: Any events coming up near Phoenix?
  # Notes under an answer, and its status before any text arrives.
  chat:
    thinking: Thinking…
    stopped: Stopped.
    sessionEnded: Your session ended. Log in again to keep chatting.
    failed: Something went wrong with the assistant. Try again.
    cutShort: The answer was cut short. Ask for less at a time.
    stoppedEarly: The answer stopped early. Try again.
    unreachable: Couldn't reach the assistant. Check your connection and try again.
  # Thumbs up or down under each answer.
  feedback:
    group: Rate this answer
    good: Good answer
    bad: Bad answer
    failed: Couldn't send that. Try again.
    thanks: Thanks for the feedback.
    # Asked after a thumbs down, above the reasons.
    why: What was wrong? (optional)
    reasons:

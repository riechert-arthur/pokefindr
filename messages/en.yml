# PokeFindr's English messages, the source for every other language (docs/i18n.md).
#
# Keys are nested by area. Messages are ICU: {name} is a placeholder, and
# {count, plural, one {# place} other {# places}} picks a form by number.
# Comments say where a message shows and what its placeholders hold.

errors:
  # The 404 page, for any address that doesn't exist.
  notFound:
    # Small heading above the title.
    code: "404"
    title: Page not found
    body: Sorry, we couldn’t find the page you’re looking for.
  # The page shown when a page fails to load. The error's own text shows below the title.
  error:
    code: Error
    title: Something went wrong
  # Buttons on both pages.
  home: Go back home
  # Opens our Discord server.
  support: Contact support

# Counts and times, used across the app. ICU plurals: "one" and "other" here,
# and whatever forms a language needs in its own catalog.
format:
  # A count of places of more than one kind: "12 places in view". {more} is "+"
  # when there are more than were loaded ("2,000+ places"), and empty otherwise.
  places: "{count, plural, one {# place} other {#{more} places}}"
  # A count of one kind of place, as above.
  kinds:
    vending: "{count, plural, one {# vending machine} other {#{more} vending machines}}"
    shop: "{count, plural, one {# card shop} other {#{more} card shops}}"
    event: "{count, plural, one {# event} other {#{more} events}}"
  # How long ago a review was written. After a week it's a date instead ("Mar 4").
  ago:
    now: just now
    minutes: "{count} min ago"
    hours: "{count} hr ago"
    days: "{count, plural, one {# day ago} other {# days ago}}"

  cancelAdding: Cancel adding a place
  title: Add a place
  # {kind}: shop or event.
  titleKind: "{kind, select, shop {Add a card shop} other {Add an event}}"
  steps:
    label: Steps
    # For screen readers, before each step's name.
    position: "Step {n} of {total}: "
    type: Type

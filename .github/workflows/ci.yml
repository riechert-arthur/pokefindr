name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - name: Build (no secrets needed)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pokefindr
          POSTGRES_PASSWORD: pokefindr
          POSTGRES_DB: pokefindr
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pokefindr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Schema and migrations are in sync
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/server/db/schema changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Migrations apply to an empty database
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: postgres://pokefindr:pokefindr@localhost:5433/pokefindr
      - run: npm run test:integration

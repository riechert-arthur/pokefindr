name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck, unit and integration tests live in tests.yml.
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (no secrets needed)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pokefindr
          POSTGRES_PASSWORD: pokefindr
          POSTGRES_DB: pokefindr
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pokefindr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Schema and migrations are in sync
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/server/db/schema changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Migrations apply to an empty database
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: postgres://pokefindr:pokefindr@localhost:5433/pokefindr

  container:
    name: Container smoke test
    # Proves the app runs outside Vercel: production image + plain PostGIS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start database and app
        run: docker compose --profile app up -d --build --wait
      - name: Migrate and load map data
        env:
          DATABASE_URL: postgres://pokefindr:pokefindr@localhost:5433/pokefindr
        run: |
          npx drizzle-kit migrate
          npm run db:backfill-locations -- --apply
      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:3000/api/health
          count=$(curl -fsS http://localhost:3000/api/locations | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).features.length))")
          echo "locations served: $count"
          test "$count" -gt 0
          curl -fsS -o /dev/null http://localhost:3000/map
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/my-reviews)" = 401
      - name: App logs
        if: failure()
        run: docker compose --profile app logs app

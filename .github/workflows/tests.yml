name: Tests

# Runs on every pull request, whatever its base branch, so each PR in a
# stacked series gets checked. Branches without integration tests yet skip
# that job instead of failing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  # Superseded PR pushes are cancelled; every commit on main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Architecture boundary warnings (#325), counted in the job summary. Warnings only until #338.
      - name: Boundary violations
        run: |
          npm run -s lint:boundaries | tee boundaries.txt
          { echo '### Boundary violations'; echo '```'; head -40 boundaries.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: npx tsc --noEmit
      - name: Build (no secrets needed)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Integration tests need Postgres and run in their own job.
      - run: npx vitest run --exclude "__tests__/integration/**" --reporter=default --reporter=github-actions

  storybook:
    name: Storybook build and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Fails if any story stops compiling.
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      # axe on every story in light and dark; serious/critical violations fail
      # (.storybook/test-runner.ts, docs/design-system.md#accessibility).
      - name: Accessibility checks
        run: |
          python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static >/dev/null 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:6006/index.json >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:6006/index.json >/dev/null || { echo "Storybook server didn't start on :6006"; exit 1; }
          npm run test-storybook -- --maxWorkers=2

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The test setup drops and recreates this database and applies every
      # migration, so no separate migrate step is needed. The tests also check
      # that the migrations build exactly src/server/db/schema (drift check).
      TEST_DATABASE_URL: postgres://pokefindr:pokefindr@localhost:5433/pokefindr_test
      # Mailpit, for the tests that send email and read it back.
      TEST_MAILPIT_URL: http://localhost:8025
      TEST_SMTP_URL: smtp://localhost:1025
    steps:
      - uses: actions/checkout@v4
      - name: Check for integration tests
        id: present
        run: |
          if [ -f vitest.integration.config.mts ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ -d __tests__/integration ]; then
            echo "::error::__tests__/integration exists but vitest.integration.config.mts does not. Was the config renamed?"
            exit 1
          else
            echo "::notice::No integration tests on this branch yet; skipping."
          fi
      # Started here rather than as a job service, so branches without
      # integration tests don't pay for pulling and booting it.
      - name: Start PostGIS
        if: steps.present.outputs.found == 'true'
        run: |
          docker run -d --name postgis \
            -e POSTGRES_USER=pokefindr -e POSTGRES_PASSWORD=pokefindr -e POSTGRES_DB=pokefindr \
            -p 5433:5432 \
            --health-cmd "pg_isready -h 127.0.0.1 -U pokefindr -d pokefindr" --health-interval 2s --health-timeout 3s --health-retries 30 \
            postgis/postgis:16-3.4
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgis)" = healthy ] && exit 0
            sleep 2
          done
          docker logs postgis
          exit 1
      - name: Start Mailpit
        if: steps.present.outputs.found == 'true'
        run: docker run -d --name mailpit -p 8025:8025 -p 1025:1025 axllent/mailpit:v1.32
      - if: steps.present.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.present.outputs.found == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.present.outputs.found == 'true'
        run: npx vitest run --config vitest.integration.config.mts --reporter=default --reporter=github-actions

  local-stack:
    name: make run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROGRESS: plain
    steps:
      - uses: actions/checkout@v4
      - name: First run, from a fresh clone with no keys
        run: |
          docker compose version
          make run
          test -f .env.local
          curl -fsS -o /dev/null http://localhost:3000/map
      # Sign-up, email confirmation, login, a review, logout, password reset and
      # the dev user, through the browser, with Mailpit catching the emails.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Account flows end to end
        run: npx playwright test
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Second run changes nothing
        run: |
          env_before=$(sha256sum .env.local)
          web_before=$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q web)")
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ); sleep 1
          make run
          docker compose logs --no-log-prefix --since "$since" init | tee init.log
          [ "$env_before" = "$(sha256sum .env.local)" ] || { echo "::error::.env.local changed"; exit 1; }
          [ "$web_before" = "$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q web)")" ] || { echo "::error::web restarted"; exit 1; }
          grep -q "Nothing to apply." init.log || { echo "::error::second run applied migrations"; exit 1; }
          grep -q "0 added, 0 updated" init.log || { echo "::error::second run changed seed data"; exit 1; }
          if grep -q "Installing dependencies" init.log; then echo "::error::second run reinstalled dependencies"; exit 1; fi
      - name: A new migration is the only one applied
        run: |
          printf 'export async function up(): Promise<void> {}\nexport async function down(): Promise<void> {}\n' > database/migrations/9999_ci_noop.ts
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ); sleep 1
          make run
          docker compose logs --no-log-prefix --since "$since" init | tee init.log
          grep -q "applied 9999_ci_noop" init.log
          [ "$(grep -c '^applied ' init.log)" = 1 ] || { echo "::error::expected exactly one migration"; exit 1; }
          docker compose exec -T web npx tsx scripts/db/migrate.ts down
          rm database/migrations/9999_ci_noop.ts
      - name: A branch's migrations stay in its own database
        run: |
          git config user.name ci && git config user.email ci@example.com
          start=$(git rev-parse HEAD)
          git switch -q -c ci-branch-a
          printf 'export async function up(): Promise<void> {}\nexport async function down(): Promise<void> {}\n' > database/migrations/9999_ci_branch_a.ts
          git add database/migrations && git commit -q -m "ci: branch migration"
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ); sleep 1
          make run
          docker compose logs --no-log-prefix --since "$since" init | tee init.log
          grep -q "as a copy of pokefindr" init.log
          grep -q "applied 9999_ci_branch_a" init.log
          # Back on the original checkout, which never had that migration.
          git switch -q --detach "$start"
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ); sleep 1
          make run
          docker compose logs --no-log-prefix --since "$since" init | tee init.log
          grep -q "Nothing to apply." init.log
          git branch -q -D ci-branch-a
          make prune | tee prune.log
          grep -q "Dropped 1 branch database" prune.log
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

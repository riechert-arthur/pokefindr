name: Migrate databases

# Applies pending migrations when commits land on main: staging first, then
# production only if staging succeeded (docs/database.md, "Deploying
# migrations"). Each GitHub environment holds its own Neon branch's direct URL
# as the secret DATABASE_URL_UNPOOLED.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two migration runs at once, and never cancel one halfway.
concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Migrate staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps: &migrate
      - name: Check the database URL is set
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Set the DATABASE_URL_UNPOOLED secret in the ${{ github.job }} environment (Settings → Environments)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:status
      - run: npm run db:migrate
      # Fails if the database doesn't match src/server/db/schema.
      - run: npm run db:check
      # Copies src/data/vending_machines_mod.json into `locations` (#73). Its own
      # transaction, after the migrations commit, so it never holds their locks.
      # Writes only changed rows; does nothing once the JSON is gone (#80).
      - run: npm run db:import-locations -- --apply

  production:
    name: Migrate production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps: *migrate
